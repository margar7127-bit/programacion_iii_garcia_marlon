<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introducción a Javascript</title>
    <script>
        alert('¡Corre,Morty! al inicio de la Página');
        console.log('Saludo desde el Inicio de la Página');
    </script>
</head>
<body>
    <h1>Incluir Javascript en documento HTML</h1>
    <h2>Modo Inline</h2>
    <button onclick="alert('¡Corre, Morty!')">Mostrar Mensaje</button>
    <input type="text" oninput="console.log(this.value)" placeholder="escribe algo">
    <input type="text" onchange="console.log(this.value)">
    <input type="text" onfocus="console.log('el usuario esta escribiendo aqui')" onblur="alert('regresa al campo de texto')" placeholder="escribe algo">
    <script src="01_incluir.js"></script>
</body>
</html>
