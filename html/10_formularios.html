<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <form action="/registro" method="POST">
        <table> 
            <tr>
                <td> 
                    <label for="nombre">Nombre:</label>
                    <input type="text" name="nombre" placeholder="Nombre">
                </td>
                <td>
                    <label for="apellido">Apellido:</label>
                    <input type="text" name="apellido" placeholder="Apellido">
                </td>
            </tr>
            <tr>
                <td>
                     <label for="password">Contraseña:</label> 
                     <input type="password" name="password" placeholder="Contraseña">
                </td>
                <td>
                    <label for="password_confirm" name="password_confirm">Confirmar Contraseña:</label>
                    <input type="password" name="password_confirm" placeholder="Confirmar Contraseña">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Edad">Edad:</label>
                    <input type="number" name="Edad" placeholder="Edad">
                </td>
                <td>
                    <label for="nivel">Nivel de la Fueza</label>
                    <input type="number" id="nivel" name="nivel" min="10" max="100" value="50" step="5">
                </td>
            </tr>
            <tr>
                <td>
                    <p>Selecciona tu bando</p>
                    <input type="radio" name="bando" value="jedi" id="jedi">
                    <label for="jedi">Jedi</label>
                    <input type="radio" name="bando" value="sith" id="sith">
                    <label for="sith">Sith</label>
                </td>
                <td>
                    <label for="habilidades">Selecciona tus habilidades:</label>
                    <input type="checkbox"
                           id="fuerza"
                           name="habilidades"
                           value="fuerza">
                    <br>
                    <label for="fuerza">Uso de la Fuerza</label>
                    <input type="checkbox"
                           id="sable"
                           name="habilidades"
                           value="sable">
                    <br>
                    <label for="sable">Sable de Luz</label>
                    <input type="checkbox"
                           id="levitar"
                           name="habilidades"
                           value="levitar">
                    <label for="levitar">Levitación</label>
                </td>
            </tr>
            <tr>
            <td>
                    <label for="planeta">Planeta de Origen</label>
                    <select id="planeta" name="planeta" required>
                        <option value="">Selecciona un planeta</option>
                        <option value="tatooine">Tatooine</option>
                        <option value="naboo">Naboo</option>
                        <option value="coruscant">Coruscant</option>
                        <option value="alderaan">Alderaan</option>
                    </select>
            </td>
            <td>
                    <label for="droide">Droide</label>
                    <select id="droide" name="droide" multiple size="2">
                        <option value="">Selecciona un droide</option>
                        <option value="C3PO">C3PO</option>
                        <option value="R2D2">R2D2</option>
                        <option value="BB8">BB-8</option>
                        <option value="B1">B1</option>
                    </select>
            </td>
        </tr>
        <tr>
            <td>
                <fieldset>
                    <legend>Datos Generales</legend>
                    <label for="misiones">Misiones</label>
                    <input type="number" id="misiones" name="misiones">
                    <br>
                    <label for="vuelos">Vuelos</label>
                    <input type="number" id="vuelos" name="vuelos">
                </fieldset>
            </td>
        </tr>

        </table>
        
    <button type="reset">Limpiar</button>
    <button type="submit">Enviar</button>
    </form>
</body>
</html>
