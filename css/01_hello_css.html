<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello CSS</title>
    <style>
        h2{
            color: blueviolet;
        }
        p{
            color: green;
        }
    </style>
    <link rel="stylesheet" href="01_hello_css.css">
</head>
<body>
    <h2>Maneras de incluir estilos css en un archivo HTML</h2>
    <h1 style="color: red;">Hello World con CSS - tipo inline</h1>
    <h2>Estilos CSS - Interno</h2>
    <p>Esta es la manera de incluir estilos dentro del archivo html, colocando la etiqueta style dentro de la etiqueta head</p>
    <h3>Estilos CSS - Externo</h3>
    <a href="#">Se incluyó estilo a traves de un archivo externo</a>
</body>
</html>
