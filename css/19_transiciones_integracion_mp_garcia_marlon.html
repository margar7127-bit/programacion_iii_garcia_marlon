<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cocina en Vivo - Restaurante La Casona</title>

    <link rel="stylesheet" href="19_transiciones_integracion_mp_garcia_marlon.css">
</head>
<body>

    <header>
        <h1>Cocina en Vivo</h1>

        <p>
            Así preparamos tu pedido
            en Restaurante La Casona.
        </p>
    </header>

    <main>

        <section class="escena"
                 aria-label="Escena animada de la cocina">

            <div class="chispa chispa1"></div>
            <div class="chispa chispa2"></div>
            <div class="chispa chispa3"></div>
            <div class="chispa chispa4"></div>
            <div class="chispa chispa5"></div>

            <div class="plato">
                <span aria-hidden="true">🍽</span>
                <p>Hornado</p>
            </div>

            <div class="alerta">
                PEDIDO LISTO
            </div>

        </section>

        <section class="controles">

            <h2>Centro de operaciones</h2>

            <div class="panel">

                <article class="timbre-contenedor">

                    <h3>Timbre de cocina</h3>

                    <div class="timbre"
                         aria-hidden="true">

                        <div class="pulso"></div>

                        <div class="centro"></div>

                    </div>

                </article>

                <article class="estado">

                    <h3>Estado del pedido</h3>

                    <p>
                        Preparación en curso.
                    </p>

                    <p>
                        Plato: Hornado con mote
                    </p>

                    <p>
                        Mesa: 5
                    </p>

                </article>

            </div>

        </section>

    </main>

    <footer>
        <p>Restaurante La Casona - 2026</p>
    </footer>

</body>
</html>
